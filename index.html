<style>
/* Book trim size: 6 in x 9 in per page (576 x 864 px at 96 dpi) */
@page{size:6in 9in;margin:0}
:root{--stage:#D9B07A;--stage2:#B98B50;--ink:#34404A;--paper:#FFFDF4;--or:#F58F2B;--ortxt:#B85600;--teal:#187A6F;--tealbright:#2FB3A3;--pink:#F27C93;--pinktxt:#B8405A;--yel:#FFD25A;--chrome:#fff;--chromeink:#17695F;--board:#2F6B5A;--wood:#B98B50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0}

#book{position:absolute;inset:0;perspective:3000px;transition:transform .8s ease}
.leaf{position:absolute;left:576px;top:0;width:576px;height:864px;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.3,1)}
.leaf.f{transform:rotateY(-180deg)}
/* notebook-paper pages */
.side{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(70,150,210,.16) 31px 32px);background-position:0 44px;padding:44px 48px;color:#34404A;font-size:16px}
.side::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:rgba(220,80,110,.45);pointer-events:none}
.side::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:16px;background:radial-gradient(circle at 8px 50%,#8f6b3f 0 5px,transparent 6px) 0 0/16px 288px repeat-y;pointer-events:none}

.fit{overflow:hidden}

.card{border-radius:20px;padding:16px;cursor:pointer;height:100%}
.row{display:flex;align-items:center;gap:14px;margin-bottom:16px}

.prog{margin:12px 0;text-align:center}
.pbar{height:14px;border-radius:99px;background:#E7E0CC;overflow:hidden;border:2px solid #d3c9a8}
.pfill{display:block;height:100%;width:0;background:#17753f;transition:width .4s}
.ptxt{font-weight:800;font-size:14px;margin-top:4px;color:#34404A}
.akopen{display:none}body.ak-on .akopen{display:block}body.ak-on .aklock{display:none}
.st{font-weight:800;font-size:14px;min-width:96px}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--chrome);width:100%}
#bar button.l{background:#fff;color:var(--ortxt);border:2px solid var(--ortxt);padding:5px 0;width:34px}
#bar button.l.on{background:var(--ortxt);color:#fff}
#bar .t{color:var(--chromeink);font-weight:800;min-width:92px;text-align:center}
#toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,20px);background:#2F6B5A;color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.35s;z-index:5000;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (prefers-reduced-motion:reduce){.leaf,#book,#toast,.pfill{transition-duration:.01s}}
/* Printing: one 6 x 9 in page per sheet */
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

 #book{position:static;transform:none!important;perspective:none}
 .leaf{position:static;width:6in;height:auto;transform:none!important;transform-style:flat}
 .side,.side.bk,.side.fr{position:relative;display:block;width:6in;height:9in;transform:none!important;backface-visibility:visible;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
 .side.empty{display:none}
}

<script>
const D={"CREATORS": ["Concepcion, Abigail, Mendoza", "De Leon, Jeon, Cruz", "Dorognan, Joshael, Javier", "Erolin, Amiel, Beronio", "Fanugao, Demberly, Bulanhigan", "Gallardo, Aubrylle Dell, Esmero", "Laurio, Marleu, Chavez", "Manlabao, Dranreve Kyle, Luarez", "Penis, Jenalyn, Buhia", "Relox, Dinlene, Pastelero"], "INTRO": ["Words are more than letters and definitions. They can tell stories, express experiences, and help us understand the world around us.", "Welcome to our Storybook Dictionary! This collection introduces five vocabulary words, from K to O, through connected stories about Miguel and his journey toward achieving his dream of becoming a teacher. As Miguel faces financial difficulties, educational challenges, and important life decisions, readers will encounter words presented in meaningful situations. Through storytelling, illustrations, and activities, this dictionary aims to make vocabulary learning more enjoyable while encouraging readers to reflect on real-life experiences and social issues.", "So, turn the pages, follow the path, and discover how every word has a story to tell!"], "GUIDE": [["1. Meet the Word", "Get to know the featured word through its pronunciation, part of speech, and simple definition."], ["2. Meet the Characters", "Discover the characters who bring each story to life and help readers understand the featured word."], ["3. Tell the Story", "Follow the story through three connected parts, presented using comic panels, narration, and character dialogues."], ["4. Vocabulary Activity", "Test your understanding and apply what you have learned through short activities."]], "LETTERS": ["k", "l", "m", "n", "o"], "WORDS": {"k": {"letter": "K", "word": "Kindle", "pron": "/ˈkin.dəl/", "pos": "Verb", "defn": "To cause a feeling, interest, or idea to begin or grow.", "rx": "(kindl\\w*)", "color": "#F29CB0"}, "l": {"letter": "L", "word": "Labyrinth", "pron": "/ˈlab.ə.rɪnθ/", "pos": "Noun", "defn": "A maze or a confusing place with many paths that make it difficult to find the way out.", "rx": "(labyrinth\\w*)", "color": "#A6D96A"}, "m": {"letter": "M", "word": "Malleable", "pron": "/ˈmæl.i.ə.bəl/", "pos": "Adjective", "defn": "Able to be shaped, changed, or adjusted easily.", "rx": "(malleable\\w*)", "color": "#FFD25A"}, "n": {"letter": "N", "word": "Navigate", "pron": "/ˈnæv.ɪ.ɡeɪt/", "pos": "Verb", "defn": "To find and follow a way through a place, situation, or challenge.", "rx": "(navigat\\w*)", "color": "#7FC8F8"}, "o": {"letter": "O", "word": "Outlook", "pron": "/ˈaʊt.lʊk/", "pos": "Noun", "defn": "A way of thinking about or viewing a situation or the future.", "rx": "(outlook\\w*)", "color": "#C9B6F2"}}, "CHARS": {"k": [["Miguel", "The Dreamer; our main protagonist"], ["Lakas", "The Encourager; represents courage and perseverance."], ["Dunong", "The Thinker; represents wisdom and resourcefulness."]], "l": [["Miguel", "A determined boy who dreams of becoming a teacher. He is now searching for a university where he can pursue his chosen degree."], ["Lakas", "Miguel’s loyal schoolbag companion who reminds him to stay hopeful despite the challenges he encounters."], ["Dunong", "Miguel’s clever notebook companion who encourages him to examine his choices and think about practical solutions."]], "m": [["Miguel", "He begins to realize that changing his plans does not mean giving up on his dream."], ["Lakas", "He encourages Miguel to remain brave even when things do not go as planned."], ["Dunong", "He helps Miguel recognize that being flexible and considering alternatives can lead to better decisions."]], "n": [["Miguel", "Now more open to different possibilities, Miguel is ready to take action and find a realistic way to pursue his dream."], ["Lakas", "He reminds Miguel that asking for help is also a sign of courage."], ["Dunong", "He guides Miguel in finding useful information, seeking advice, and exploring opportunities that may help him move forward."]], "o": [["Miguel", "After exploring his options and seeking guidance, Miguel now has a clearer perspective on his future and the steps he needs to take."], ["Lakas", "He reminds Miguel to remain hopeful and believe that even small steps can bring him closer to his dream."], ["Dunong", "He helps Miguel recognize how learning from experiences and considering different perspectives can lead to wiser decisions."]]}, "STORY": {"k": ["The Dream We Kindle", [[["n", "Miguel always admired his teacher’s ability to inspire learners. He imagined himself standing in front of a classroom someday, helping students discover new things."], ["d", "Miguel", "“I want to become a teacher, too!”"], ["d", "Lakas", "“Then that’s a dream worth pursuing!”"]], [["n", "One evening, Miguel overheard his mother discussing their household expenses. He began worrying about the costs of college, especially tuition, transportation, and school supplies."], ["d", "Miguel", "“What if we cannot afford my education, Ma?”"], ["d", "Mother", "“We have to consider our needs carefully, anak. But I also want you to have a chance to study.”"], ["d", "Dunong", "“Maybe we can explore the opportunities available to students before giving up.”"]], [["n", "Miguel realized that although his family’s financial situation was difficult, he did not have to abandon his dream immediately. He decided to learn about possible ways to continue his education."], ["d", "Miguel", "“I may not know how yet, but I’ll start looking for a way.”"]]], "With renewed hope, Miguel’s dream of becoming a teacher was finally kindled. He knew that the journey would not be easy, but he was ready to take his first step."], "l": ["The Labyrinth of Choices", [[["n", "Miguel began searching for universities that offered an education program. He was excited to discover several schools, but most of the universities he liked were far from home."], ["d", "Miguel", "“This university offers the program I want! But it’s so far away.”"], ["d", "Lakas", "“That’s exciting! Maybe this is where your journey will take you.”"]], [["n", "As Miguel explored his options, he discovered that studying far from home meant more than paying tuition. He also had to consider transportation, accommodation, food, and other daily expenses. Every option seemed to lead to another problem."], ["d", "Miguel", "“If I choose this university, where will I stay? How will I afford my daily expenses?”"], ["d", "Dunong", "“It seems like you’re walking through a labyrinth of choices, Miguel. Every path has something you need to consider.”"], ["d", "Miguel", "“I thought finding a university would be simple. Now, I don’t even know which direction to take.”"]], [["n", "Miguel stared at the list of universities on his notebook. He realized that choosing a school was not only about finding one that offered his dream course. He also needed to consider his family’s financial situation and what they could realistically manage."], ["d", "Lakas", "“You don’t have to choose everything today. Take your time.”"], ["d", "Dunong", "“Let’s examine your options one by one. There might be a path that works for you.”"]]], "Miguel still had many questions, but he was ready to explore his options one step at a time. Though the road ahead remained confusing, he was determined to find his way through the labyrinth of choices."], "m": ["A Malleable Dream", [[["n", "After listing his university options, Miguel realized that his first choice might be difficult for his family to afford. He felt disappointed because he had already imagined himself studying there."], ["d", "Miguel", "“I really wanted to study at that university. Does this mean I have to give up on my dream?”"], ["d", "Lakas", "“Not necessarily, Miguel. Maybe there’s another way to reach it.”"]], [["n", "Dunong opened Miguel’s notebook and helped him compare nearby universities. They looked into tuition fees, available programs, transportation costs, and possible scholarships. Miguel began to realize that he could consider other schools without changing t asking questions, seeking guidance, and making informed decisions."]]], "Miguel was no longer simply wondering where to go. With the help of others and the information he had gathered, he was finally learning how to navigate his way toward his dream."], "o": ["A New Outlook on the Future", [[["n", "After discovering a nearby public university that offered an education program, Miguel felt relieved. However, he knew that there were still requirements to complete and expenses to prepare for."], ["d", "Miguel", "“I finally found a university that fits my plans. But I know there’s still a lot to consider.”"], ["d", "Lakas", "“That’s okay, Miguel! At least now, you have a clearer direction.”"]], [["n", "Miguel and his mother reviewed the university’s requirements and discussed how they could prepare for his education. He also remembered how much he had learned from exploring different schools, adjusting his plans, and asking for guidance."], ["d", "Dunong", "“You’ve learned that reaching your goal takes more than simply choosing a university. It also means understanding your situation and making informed decisions.”"], ["d", "Miguel", "“You’re right. I used to think there was only one path toward my dream.”"]], [["n", "With a better understanding of his choices, Miguel became more confident about planning his next steps. He knew that challenges might still come, but he was now more prepared to face them."], ["d", "Lakas", "“Your dream hasn’t changed, Miguel. You’ve just learned to see more possibilities!”"]]], "Miguel developed a new outlook on his future. He realized that pursuing a dream does not always mean following the path he first imagined. Sometimes, it means learning, adjusting, and finding opportunities along the way."]}, "QUIZ": {"k": ["Read each situation and choose the sentence that correctly uses the word kindle.", [["A student watches a documentary about marine life and becomes interested in protecting the ocean. Which sentence uses kindle correctly?", ["The documentary kindled her interest in ocean conservation.", "The documentary kindled her school bag.", "The documentary kindled her homework."], "A"], ["Which situation best shows the meaning of kindle?", ["A learner forgets to bring a notebook.", "A teacher’s encouragement inspires a student to pursue teaching.", "A student puts books inside a bag."], "B"], ["Which sentence best demonstrates the use of kindle?", ["The student’s curiosity was kindled after discovering a new field of science.", "The student’s curiosity was measured after discovering a new field of science.", "The student’s curiosity was borrowed after discovering a new field of science."], "A"]]], "l": ["Read each situation carefully. Choose the one that best shows the meaning of labyrinth.", [["Which situation best represents a labyrinth?", ["A straight road leading to a nearby school.", "A maze with many confusing paths and turns.", "An open field with only one entrance."], "B"], ["Which situation uses labyrinth figuratively?", ["Miguel finds himself confused by the many university choices and requirements.", "Miguel walks along a familiar road to school.", "Miguel arranges his books inside his bag."], "A"], ["Complete the sentence with the correct word: “With so many choices and challenges, Miguel felt like he was wandering through a ______.”", ["classroom", "shortcut", "labyrinth"], "C"]]], "m": ["Read each question carefully and choose the best answer for the word malleable.", [["Which object is an example of something malleable?", ["A lump of clay that can be shaped into different forms.", "A glass cup that breaks when dropped.", "A stone that is difficult to reshape."], "A"], ["Which situation best shows someone being malleable in their plans?", ["Miguel refuses to consider any university except his first choice.", "Miguel adjusts his university choices after considering his family’s budget.", "Miguel abandons his dream because his first plan does not work."], "B"], ["Which statement best describes a malleable person?", ["Someone who refuses to listen to new ideas.", "Someone who easily gives up when facing challenges.", "Someone who is open to changes and willing to adjust when needed."], "C"]]], "n": ["Read each question carefully and choose the best answer for the word navigate.", [["Which situation best shows the meaning of navigate?", ["A student ignores the directions on a map.", "A traveler finds the correct route to reach a destination.", "A learner leaves their books at home."], "B"], ["Which situation shows someone navigating through a challenge?", ["Miguel asks the guidance counselor about scholarships and financial assistance.", "Miguel refuses to consider other university options.", "Miguel gives up without exploring possible solutions."], "A"], ["Which action shows Miguel learning to navigate his way toward college?", ["He waits for someone else to decide his future.", "He chooses a university without checking its requirements.", "He gathers information and seeks guidance before making a decision."], "C"]]], "o": ["Read each question carefully. Choose the answer that best demonstrates the meaning of outlook.", [["Which situation best shows a positive outlook?", ["A student believes that challenges can be overcome with effort and support.", "A student refuses to try because things might go wrong.", "A student ignores every opportunity to improve."], "A"], ["Which statement best describes Miguel’s new outlook?", ["He believes that only his first university choice can lead to success.", "He understands that there are different ways to pursue his dream.", "He thinks that planning for college is no longer necessary."], "B"], ["Which statement reflects a change in someone’s outlook?", ["“I will only succeed if everything goes exactly as planned.”", "“There may be other ways to reach my goal, even if my first plan changes.”", "“I should stop trying whenever I encounter difficulties.”"], "B"]]]}, "CONGRATS": ["You’ve completed the K–O journey!", "Five words. Five stories. Countless lessons.", "You made it, Explorer!", "You have traveled with Miguel, discovered new vocabulary, explored meaningful stories, and learned that every word can open a new way of understanding the world.", "Keep learning, keep growing, and keep dreaming!", "Every word is another step toward a bigger world."], "RI": "As you finish Miguel’s journey, remember that choosing your future is not always easy. Sometimes, you may face financial challenges, confusing choices, and unexpected changes.", "RL": [["k", "Kindle your dreams, even when the beginning is difficult."], ["l", "Find your way through the labyrinth of choices."], ["m", "Stay malleable when plans need to change."], ["n", "Navigate challenges by seeking guidance and exploring opportunities."], ["o", "Develop a positive outlook while making realistic decisions."]], "RE": "A gentle reminder: Your journey does not have to look like everyone else’s. Take your time, ask questions, explore your opportunities, and remember that changing your plans does not mean giving up on your dreams."};

 add('story_'+l,`<div class="fit" data-max="20" style="height:740px">${parts.map((p,j)=>`<div class="part"><div class="num" style="background:${['#F29CB0','#FFD25A','#7FD1C4'][j]}">${j+1}</div><div>${p.map(x=>x[0]=='n'?`<p>${hlw(x[1],l)}</p>`:`<p><span class="sp" style="background:${spk[x[1]][0]};color:${spk[x[1]][1]}">${x[1]}</span>${hlw(x[2],l)}</p>`).join('')}</div></div>`).join('')}<div class="end">★ ${hlw(closing,l)}</div></div>`);
 add('quiz_'+l,`<h2 style="font-size:36px;margin-bottom:6px">Let’s try!</h2><div class="fit" data-max="19" style="height:610px"><p style="margin:0 0 10px"><b style="color:var(--teal)">Instructions:</b> ${ins}</p>${qs.map((q,n)=>`<div class="q"><div>${n+1}. ${q[0]}</div>${q[1].map((o,k)=>`<label><input type="radio" name="${l}${n}" value="${'ABC'[k]}"><span><b>${'ABC'[k]}.</b> ${o}</span></label>`).join('')}</div>`).join('')}</div>
 <div style="text-align:center;margin-top:10px"><button data-chk="${l}">Check my answers</button> <button class="b2" data-rst="${l}">Try again</button></div>`);
 add('result_'+l,`<h2>How did you do?</h2><div id="res_${l}" style="text-align:center;font-size:19px;line-height:1.5"><p>Answer the three questions on the left page, then press <b>Check my answers</b>.</p></div>${prog()}<div style="position:absolute;left:48px;right:48px;bottom:60px;border-radius:14px;overflow:hidden;border:3px solid #F3E6C4">${sc(...SCN[l][EMB[l]])}</div>`);
});
add('congrats',`<h2 style="font-size:36px">CONGRATULATIONS!</h2><div class="big" style="border-radius:14px;overflow:hidden;border:3px solid #F3E6C4">${cast3()}</div><div style="text-align:center;margin-top:14px;line-height:1.45"><p style="font:700 22px Fredoka;margin:6px">${D.CONGRATS[0]}</p><p style="color:var(--pinktxt);font-weight:800;margin:4px">${D.CONGRATS[1]}</p><p style="color:var(--teal);font:700 22px Fredoka;margin:6px">${D.CONGRATS[2]}</p><p>${D.CONGRATS[3]}</p><p style="font-weight:800">${D.CONGRATS[4]}<br>${D.CONGRATS[5]}</p><p style="color:#5f6a73">— Group 3</p><button class="b3 ak" data-go="answers">Answer key</button></div>`);
add('reminder',`<h2 style="font-size:32px">A little reminder before you go</h2><p style="line-height:1.45">${D.RI}</p><p><b>But just like Miguel, you can learn to:</b> <span style="font-size:13px;color:#5f6a73">(tap one to revisit)</span></p>${D.RL.map(([l,t])=>`<div data-go="word_${l}" style="background:${col[l]}99;border-radius:14px;padding:11px 14px;margin:9px 0;cursor:pointer;font-weight:700"><span class="sp" style="background:${col[l]}">${W[l].letter}</span>${t}</div>`).join('')}<p style="font-style:italic;line-height:1.45;margin-top:18px">${D.RE}</p>`);
add('answers',`<h2>Answer Key</h2>
 <div class="aklock" style="text-align:center"><p style="font:700 24px Fredoka;margin:8px 0">Locked</p><p style="margin:0 0 14px">Finish all five quizzes to unlock the answers.</p>${prog()}<div style="margin-top:18px;text-align:left">${L.map(l=>`<div class="row" data-row="${l}" style="margin-bottom:14px"><div class="num" style="background:${col[l]};width:44px;height:44px;flex:0 0 44px;font-size:22px">${W[l].letter}</div><b style="width:110px;font:600 19px Fredoka">${W[l].word}</b><span class="st" data-st="${l}">Not done yet</span><button class="b4" data-go="quiz_${l}">Go to quiz</button></div>`).join('')}</div></div>
 <div class="akopen"><p style="text-align:center;margin:0 0 16px">Great work! Here are the correct answers.</p>${L.map(l=>`<div class="row"><div class="num" style="background:${col[l]};width:44px;height:44px;flex:0 0 44px;font-size:22px">${W[l].letter}</div><b style="width:110px;font:600 19px Fredoka">${W[l].word}</b>${D.QUIZ[l][1].map((q,n)=>`<span class="chip" style="background:var(--teal)">${n+1}: ${q[2]}</span>`).join('')}</div>`).join('')}</div>`);
add('end',`<h2 style="font-size:40px;margin-top:20px">The End</h2><div class="big" style="border-radius:14px;overflow:hidden;border:3px solid #F3E6C4;margin-top:30px">${cast3()}</div><p style="font:600 22px Fredoka;text-align:center;margin:26px 0 20px;line-height:1.35">${D.CONGRATS[5]}</p><div style="text-align:center"><button class="b3" data-go="cover">Read again</button> <button class="b3 ak" data-go="answers">Answer key</button></div>`);
add('backcover',board(`<div style="padding-top:150px"><h1 style="font-size:46px;line-height:1.1;color:#fff">Word by Word,<br><span style="color:#FFD25A">Step by Step</span></h1><p style="font:600 22px Fredoka;margin:16px 30px 0">${D.CONGRATS[5]}</p><svg viewBox="0 0 520 200" style="width:440px;margin-top:40px" role="img" aria-label="Miguel, Lakas and Dunong">${[['bag',150],['boy',260,'happy'],['note',370]].map(([t,x,m])=>`<g transform="translate(${x},196) scale(.95)">${CH[t](m)}</g>`).join('')}</svg><p style="font-weight:800;margin-top:24px">— Group 3 —</p></div>`));
/* ---------- book ---------- */
const N=Math.ceil(S.length/2),book=document.getElementById('book');let cur=0;
const pg=(h,cls,i)=>h==null?`<div class="side ${cls} empty"></div>`:`<div class="side ${cls}${i==0||i==S.length-1?' cv':''}">${h}${i>0&&i<S.length-1?`<span class="pn">${i}</span>`:''}</div>`;
book.innerHTML=Array.from({length:N},(_,j)=>`<div class="leaf" data-j="${j}">${pg(S[2*j],'fr',2*j)}${pg(S[2*j+1],'bk',2*j+1)}</div>`).join('')+'<div class="zone" id="zl" style="left:0"></div><div class="zone" id="zr" style="right:0"></div>';
const leaves=[...book.querySelectorAll('.leaf')];
function paint(){leaves.forEach((l,j)=>{l.classList.toggle('f',j<cur);if(!l.dataset.busy)l.style.zIndex=j<cur?j+1:N-j});
 book.style.transform=cur==0?'translateX(-288px)':cur==N?'translateX(288px)':'none';
 document.getElementById('ind').textContent=cur==0?'Cover':cur==N?'Back cover':'Page '+(2*cur-1)+'–'+(2*cur);
 document.getElementById('pv').style.visibility=cur?'visible':'hidden';document.getElementById('nx').style.visibility=cur<N?'visible':'hidden'}
function turn(d){const j=d>0?cur:cur-1;if(j<0||j>=N)return;const l=leaves[j];l.dataset.busy=1;l.style.zIndex=N+2;cur+=d;paint();setTimeout(()=>{delete l.dataset.busy;l.style.zIndex=j<cur?j+1:N-j},950)}
let busy=0;function go(n){n=Math.max(0,Math.min(N,n));if(n==cur||busy)return;busy=1;const d=n>cur?1:-1;(function s(){if(cur==n){busy=0;return}turn(d);setTimeout(s,Math.abs(n-cur)>0?170:0)})()}
const spread=k=>{const s=KEY[k];return s%2?(s+1)/2:s/2};const goKey=k=>go(spread(k));
document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('toc').onclick=()=>goKey('contents');
document.getElementById('zl').onclick=()=>go(cur-1);document.getElementById('zr').onclick=()=>go(cur+1);
document.getElementById('chips').innerHTML=L.map(l=>`<button class="l" data-go="word_${l}" style="margin:0 2px;border-radius:50%" aria-label="${W[l].word}">${W[l].letter}</button>`).join('');
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});
let sx=null;document.getElementById('stage').addEventListener('pointerdown',e=>{sx=e.clientX});document.getElementById('stage').addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>90&&!e.target.closest('input,button'))go(cur+(e.clientX<sx?1:-1));sx=null});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)goKey(g.dataset.go);
 const c=e.target.closest('[data-chk]');if(c)check(c.dataset.chk);const r=e.target.closest('[data-rst]');if(r)reset(r.dataset.rst);
 const s=e.target.closest('[data-say]');if(s)say(s)});
/* ---------- pronunciation sound ---------- */
let voices=[];const hasTTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!='undefined';
if(hasTTS){const lv=()=>{voices=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
const pick=()=>voices.find(v=>/^en[-_]US/i.test(v.lang)&&/google|samantha|zira|aria|jenny|female/i.test(v.name))||voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
function say(btn){const st=btn.closest('.side').querySelector('.say-st');
 if(!hasTTS){st.textContent='Sorry, this browser cannot play sound. Try Chrome, Edge, Safari or Firefox.';return}
 st.textContent='';const u=new SpeechSynthesisUtterance(btn.dataset.say);u.lang='en-US';const v=pick();if(v){u.voice=v;u.lang=v.lang}
 u.rate=btn.dataset.slow?0.5:0.85;
 u.onstart=()=>btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');
 speechSynthesis.cancel();speechSynthesis.speak(u)}
/* ---------- quizzes + Answer Key unlock ---------- */
const done={};
function toast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),9000)}
function sync(){const n=Object.keys(done).length;
 document.querySelectorAll('.pfill').forEach(e=>e.style.width=(n/L.length*100)+'%');
 document.querySelectorAll('.ptxt').forEach(e=>e.textContent=n+' of '+L.length+' quizzes done');
 L.forEach(l=>{document.querySelectorAll(`[data-row="${l}"]`).forEach(e=>e.classList.toggle('done',!!done[l]));document.querySelectorAll(`[data-st="${l}"]`).forEach(e=>e.textContent=done[l]?'✓ Done':'Not done yet')});
 const all=n==L.length,was=document.body.classList.contains('ak-on');document.body.classList.toggle('ak-on',all);if(all&&!was)toast()}
function check(l){const qs=D.QUIZ[l][1],reveal=document.body.classList.contains('ak-on');let sc=0,ans=0,out='';
 qs.forEach((q,n)=>{const sel=book.querySelector(`input[name="${l}${n}"]:checked`);
  book.querySelectorAll(`input[name="${l}${n}"]`).forEach(i=>{const lb=i.closest('label');lb.classList.remove('ok','no');if(i.checked)lb.classList.add(i.value==q[2]?'ok':'no');else if(reveal&&i.value==q[2])lb.classList.add('ok')});
  const ok=!!sel&&sel.value==q[2];if(sel)ans++;if(ok)sc++;
  out+=`<p>${n+1}. ${!sel?'<b style="color:#5f6a73">No answer yet</b> – choose one':ok?'<b style="color:#17753f">Correct!</b>':'<b style="color:#B52A2A">Not quite</b> – '+(reveal?'the answer is '+q[2]:'try again!')}</p>`});
 const full=ans==qs.length;if(full&&(!REQUIRE_PERFECT||sc==qs.length))done[l]=true;
 document.getElementById('res_'+l).innerHTML=`<p style="font:700 44px Fredoka;color:var(--ortxt);margin:6px">${sc} / ${qs.length}</p><p style="font-weight:800">${!full?'Answer all '+qs.length+' questions to finish this quiz.':sc==qs.length?'Great job, Explorer!':'Quiz complete! Review the ones you missed and try again.'}</p>${out}<button data-go="quiz_${l}" style="margin:4px">See the quiz</button>`;
 sync();if(spread('result_'+l)!=cur)go(spread('result_'+l))}
function reset(l){book.querySelectorAll(`input[name^="${l}"]`).forEach(i=>{i.checked=false;i.closest('label').classList.remove('ok','no')});document.getElementById('res_'+l).innerHTML='<p>Answer the three questions on the left page, then press <b>Check my answers</b>.</p>'}
function fit(){document.querySelectorAll('.fit').forEach(el=>{let s=+el.dataset.max;el.style.fontSize=s+'px';while(el.scrollHeight>el.clientHeight+1&&s>10){s-=.5;el.style.fontSize=s+'px'}})}
function scale(){const k=Math.min(innerWidth/1212,(document.getElementById('stage').clientHeight)/904);document.getElementById('scaler').style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',scale);scale();paint();sync();(document.fonts?document.fonts.ready:Promise.resolve()).then(fit);fit();
</script></body></html>
